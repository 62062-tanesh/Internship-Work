<!DOCTYPE html>
<html>
<head>
    <title>Greeting Message</title>
</head>

<body>

    <button onclick="showGreeting()">Click Me</button>

    <script>

        function showGreeting() {

            let time = new Date().getHours();

            if (time < 12) {
                alert("Good Morning!");
            }
            else if (time < 18) {
                alert("Good Afternoon!");
            }
            else {
                alert("Good Evening!");
            }

        }

    </script>

</body>
</html>
