<!DOCTYPE html>
<html>
<head>
    <title>Bulma Card Example</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>

    <div class="container mt-6">

        <div class="card" style="max-width: 350px; margin: auto;">

            <div class="card-image">
                <figure class="image is-4by3">
                    <img src="https://picsum.photos/400/300" alt="Sample Image">
                </figure>
            </div>

            <div class="card-content">

                <h2 class="title is-4">
                    Beautiful Nature
                </h2>

                <p>
                    This is a simple responsive card created using the Bulma CSS framework.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
