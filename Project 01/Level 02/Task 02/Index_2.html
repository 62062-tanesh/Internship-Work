<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Menu</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            padding: 15px 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .menu li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .menu li a:hover {
            color: yellow;
        }

        
        #check {
            display: none;
        }

        
        .menu-btn {
            display: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        
        @media (max-width: 768px) {

            .menu-btn {
                display: block;
            }

            .menu {
                display: none;
                flex-direction: column;
                width: 100%;
                text-align: center;
                margin-top: 15px;
                gap: 0;
            }

            .menu li {
                padding: 10px;
                background-color: #444;
                border-top: 1px solid #555;
            }

            #check:checked ~ .menu {
                display: flex;
            }
        }

    </style>

</head>
<body>

    <nav>

        <div class="navbar">

            <div class="logo">My Website</div>

            <input type="checkbox" id="check">

            <label for="check" class="menu-btn">&#9776;</label>

            <ul class="menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </div>

    </nav>

</body>
</html>
