<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }

        .box {
            width: 30%;
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            border: 1px solid black;
        }

        
        @media (max-width: 700px) {

            .container {
                flex-direction: column;
                align-items: center;
            }

            .box {
                width: 80%;
                margin-bottom: 20px;
            }

        }

    </style>

</head>
<body>

    <h2 style="text-align: center">
        Responsive Webpage
    </h2>

    <div class="container">

        <div class="box">
            Box 1
        </div>

        <div class="box">
            Box 2
        </div>

        <div class="box">
            Box 3
        </div>

    </div>

</body>
</html>
